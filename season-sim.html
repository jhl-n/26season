<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>계절의 변화 3D 시뮬레이션</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Malgun Gothic', sans-serif; background-color: #111; color: #fff; }
        
        #ui-panel { position: absolute; top: 15px; left: 15px; background: rgba(0, 0, 0, 0.8); padding: 15px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); max-width: 230px; z-index: 10; }
        h2 { margin: 0 0 10px 0; font-size: 14px; color: #4CAF50; border-bottom: 1px solid #4CAF50; padding-bottom: 5px; }
        .btn-group { margin-bottom: 12px; display: flex; flex-wrap: wrap; gap: 6px; }
        button { flex: 1 1 45%; padding: 6px; cursor: pointer; border: none; border-radius: 4px; background: #444; color: white; font-size: 12px; font-weight: bold; transition: 0.2s; }
        button:hover { background: #555; }
        button.active { background: #4CAF50; box-shadow: 0 0 6px #4CAF50; }
        
        #data-panel { position: absolute; bottom: 15px; left: 15px; background: rgba(0, 0, 0, 0.8); padding: 12px 15px; border-radius: 10px; border-left: 4px solid #ff9800; max-width: 250px; }
        .data-label { color: #aaa; font-size: 12px; display: block; margin-bottom: 3px; }
        .data-value { font-size: 18px; font-weight: bold; color: #ffeb3b; margin-bottom: 8px; display: block; }
        
        .legend { font-size: 11px; margin-top: 10px; padding-top: 10px; border-top: 1px solid #444; color: #ccc; }
        .legend span { display: inline-block; margin-right: 5px; margin-bottom: 3px; }
        
        #instruction { position: absolute; bottom: 15px; right: 15px; color: #aaa; font-size: 12px; text-align: right; background: rgba(0,0,0,0.5); padding: 8px; border-radius: 6px; pointer-events: none; }
        
        #fade-overlay { position: absolute; top:0; left:0; width:100%; height:100%; background:white; opacity:0; pointer-events:none; transition: opacity 0.3s; z-index: 5; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <div id="fade-overlay"></div>

    <div id="ui-panel">
        <h2>1. 자전축 기울기 설정</h2>
        <div class="btn-group">
            <button id="btn-straight">자전축 수직 (0°)</button>
            <button id="btn-tilted" class="active">기울임 (23.5°)</button>
        </div>

        <h2>2. 지구의 위치 (계절)</h2>
        <div class="btn-group">
            <button id="btn-spring">봄(가)</button>
            <button id="btn-summer" class="active">여름(나)</button>
            <button id="btn-autumn">가을(다)</button>
            <button id="btn-winter">겨울(라)</button>
        </div>

        <h2>3. 관찰자 시점 전환</h2>
        <div class="btn-group">
            <button id="btn-space" class="active">우주 관점 (전체 뷰)</button>
            <button id="btn-surface">지표면 관점 (1인칭)</button>
        </div>
    </div>

    <div id="data-panel">
        <span class="data-label">대한민국(위도 37.5°) 남중 고도</span>
        <span class="data-value" id="val-altitude">76.0°</span>
        <span class="data-label">그림자 길이 변화</span>
        <span class="data-value" style="color:#03a9f4; margin-bottom:0;" id="val-shadow">가장 짧음</span>
        
        <div class="legend" id="legend-space">
            <span style="color:#00ffff;">■ 지평선</span> 
            <span style="color:#ffea00;">■ 태양빛</span> 
            <span style="color:#ff3333;">■ 고도각</span>
        </div>
    </div>

    <div id="instruction">
        마우스 우클릭/드래그: 화면 회전<br>마우스 휠: 확대/축소
    </div>

    <script>
        let currentView = 'space'; 
        let isTilted = true;
        let currentSeason = 'summer'; 
        const koreaLatitude = 37.5;
        const tiltAngle = 23.5;

        let isTransitioning = false;
        let transitionProgress = 0;
        let pendingView = 'space';
        let startCamPos = new THREE.Vector3();
        let startTarget = new THREE.Vector3();
        let endCamPos = new THREE.Vector3();
        let endTarget = new THREE.Vector3();

        const btnClasses = {
            'tilt': ['btn-straight', 'btn-tilted'],
            'season': ['btn-spring', 'btn-summer', 'btn-autumn', 'btn-winter'],
            'view': ['btn-space', 'btn-surface']
        };

        const sceneSpace = new THREE.Scene();
        const sceneSurface = new THREE.Scene();
        sceneSurface.background = new THREE.Color(0x87CEEB); 

        const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true; 
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true; 
        controls.dampingFactor = 0.1;

        // --- 우주 뷰 (Space Scene) ---
        const spaceGroup = new THREE.Group();
        spaceGroup.rotation.y = Math.PI / 6; 
        sceneSpace.add(spaceGroup);

        const sunGeometry = new THREE.SphereGeometry(5, 32, 32);
        const sunMaterial = new THREE.MeshBasicMaterial({ color: 0xffea00 });
        const sunMesh = new THREE.Mesh(sunGeometry, sunMaterial);
        spaceGroup.add(sunMesh);

        const pointLight = new THREE.PointLight(0xffffff, 1.5, 100);
        sceneSpace.add(pointLight);
        sceneSpace.add(new THREE.AmbientLight(0x333333)); 

        const earthOrbitGroup = new THREE.Group(); 
        spaceGroup.add(earthOrbitGroup);

        const earthTiltGroup = new THREE.Group(); 
        earthOrbitGroup.add(earthTiltGroup);

        const earthSpinGroup = new THREE.Group(); 
        earthTiltGroup.add(earthSpinGroup);

        const earthGeometry = new THREE.SphereGeometry(3, 32, 32);
        const earthMaterial = new THREE.MeshPhongMaterial({ color: 0x4287f5, shininess: 10 });
        const earthMesh = new THREE.Mesh(earthGeometry, earthMaterial);
        earthSpinGroup.add(earthMesh);

        const axisGeometry = new THREE.CylinderGeometry(0.05, 0.05, 9, 8);
        const axisMaterial = new THREE.MeshBasicMaterial({ color: 0xff0000 });
        const axisLine = new THREE.Mesh(axisGeometry, axisMaterial);
        earthTiltGroup.add(axisLine); 

        const latRad = koreaLatitude * (Math.PI / 180);
        const surfaceDist = 3.02; 
        const posVector = new THREE.Vector3(surfaceDist * Math.cos(latRad), surfaceDist * Math.sin(latRad), 0);

        const horizonGeo = new THREE.CircleGeometry(1.5, 32);
        const horizonMat = new THREE.MeshBasicMaterial({ color: 0xffffff, side: THREE.DoubleSide, transparent: true, opacity: 0.7 });
        const horizon = new THREE.Mesh(horizonGeo, horizonMat);
        horizon.position.copy(posVector);
        
        const normal = posVector.clone().normalize();
        horizon.lookAt(posVector.clone().add(normal));
        earthSpinGroup.add(horizon);

        const markerGeo = new THREE.CylinderGeometry(0.08, 0.08, 0.8, 8);
        const markerMat = new THREE.MeshBasicMaterial({ color: 0x00ff00 });
        const marker = new THREE.Mesh(markerGeo, markerMat);
        marker.position.copy(posVector);
        marker.rotation.z = latRad - (Math.PI / 2); 
        earthSpinGroup.add(marker);

        // --- ☀️ [추가됨] 고도각 보조선 그룹 생성 ---
        const auxLinesGroup = new THREE.Group();
        auxLinesGroup.position.copy(posVector); // 관찰자 위치로 원점 이동
        earthSpinGroup.add(auxLinesGroup);

        // 로컬 벡터 계산 (천정 방향과 남쪽 방향)
        const zenithDir = new THREE.Vector3(Math.cos(latRad), Math.sin(latRad), 0);
        const southDir = new THREE.Vector3(Math.sin(latRad), -Math.cos(latRad), 0);

        // 1) 지평선 라인 (청록색)
        const auxHorizonGeo = new THREE.BufferGeometry();
        const auxHorizonLine = new THREE.Line(auxHorizonGeo, new THREE.LineBasicMaterial({ color: 0x00ffff, linewidth: 2 }));
        auxLinesGroup.add(auxHorizonLine);

        // 2) 태양빛 라인 (노란색)
        const auxSunRayGeo = new THREE.BufferGeometry();
        const auxSunRayLine = new THREE.Line(auxSunRayGeo, new THREE.LineBasicMaterial({ color: 0xffea00, linewidth: 2 }));
        auxLinesGroup.add(auxSunRayLine);

        // 3) 고도각 호 라인 (빨간색)
        const auxArcGeo = new THREE.BufferGeometry();
        const auxArcLine = new THREE.Line(auxArcGeo, new THREE.LineBasicMaterial({ color: 0xff3333, linewidth: 2 }));
        auxLinesGroup.add(auxArcLine);


        const orbitCurve = new THREE.EllipseCurve(0, 0, 30, 30, 0, 2 * Math.PI, false, 0);
        const orbitPoints = orbitCurve.getPoints(50);
        const orbitGeometry = new THREE.BufferGeometry().setFromPoints(orbitPoints);
        const orbitMaterial = new THREE.LineBasicMaterial({ color: 0x555555 });
        const orbitLine = new THREE.Line(orbitGeometry, orbitMaterial);
        orbitLine.rotation.x = Math.PI / 2;
        spaceGroup.add(orbitLine);


        // --- 지표면 뷰 (Surface Scene) ---
        sceneSurface.add(new THREE.AmbientLight(0x404040));
        
        const groundGeo = new THREE.PlaneGeometry(100, 100);
        const groundMat = new THREE.MeshLambertMaterial({ color: 0x55aa55 });
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        sceneSurface.add(ground);

        const stickHeight = 10;
        const stickGeo = new THREE.CylinderGeometry(0.3, 0.3, stickHeight, 16);
        const stickMat = new THREE.MeshLambertMaterial({ color: 0xdddddd });
        const stick = new THREE.Mesh(stickGeo, stickMat);
        stick.position.y = stickHeight / 2;
        stick.castShadow = true;
        sceneSurface.add(stick);

        const surfaceSunGeo = new THREE.SphereGeometry(2, 16, 16);
        const surfaceSunMat = new THREE.MeshBasicMaterial({ color: 0xffcc00 });
        const surfaceSun = new THREE.Mesh(surfaceSunGeo, surfaceSunMat);
        sceneSurface.add(surfaceSun);

        const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 1024;
        dirLight.shadow.mapSize.height = 1024;
        dirLight.shadow.camera.left = -30;
        dirLight.shadow.camera.right = 30;
        dirLight.shadow.camera.top = 30;
        dirLight.shadow.camera.bottom = -30;
        sceneSurface.add(dirLight);


        function updateSimulation() {
            let declination = 0;
            if (isTilted) {
                if (currentSeason === 'summer') declination = tiltAngle;
                else if (currentSeason === 'winter') declination = -tiltAngle;
            }

            let altitude = 90 - koreaLatitude + declination;
            document.getElementById('val-altitude').innerText = altitude.toFixed(1) + '°';

            let shadowText = "중간";
            if(altitude > 60) shadowText = "가장 짧음 (여름 특징)";
            else if(altitude < 40) shadowText = "가장 긺 (겨울 특징)";
            document.getElementById('val-shadow').innerText = shadowText;

            earthTiltGroup.rotation.z = isTilted ? (-tiltAngle * Math.PI / 180) : 0;
            
            let spinAngle = 0; 
            if (currentSeason === 'winter') { 
                earthOrbitGroup.position.set(30, 0, 0); 
                spinAngle = Math.PI; 
            } else if (currentSeason === 'spring') { 
                earthOrbitGroup.position.set(0, 0, -30); 
                spinAngle = -Math.PI / 2; 
            } else if (currentSeason === 'summer') { 
                earthOrbitGroup.position.set(-30, 0, 0); 
                spinAngle = 0; 
            } else if (currentSeason === 'autumn') { 
                earthOrbitGroup.position.set(0, 0, 30); 
                spinAngle = Math.PI / 2; 
            }
            earthSpinGroup.rotation.y = spinAngle;

            const altRad = altitude * (Math.PI / 180);
            const distance = 40;
            const lightY = Math.sin(altRad) * distance;
            const lightZ = Math.cos(altRad) * distance; 
            
            dirLight.position.set(0, lightY, lightZ);
            surfaceSun.position.copy(dirLight.position);

            // --- ☀️ [추가됨] 보조선 기하학(Geometry) 업데이트 로직 ---
            const lineLength = 5.5; // 선 길이
            const arcRadius = 1.8;  // 호 반지름

            // 태양빛이 꽂히는 방향 벡터 계산
            const sunDir = new THREE.Vector3()
                .addScaledVector(southDir, Math.cos(altRad))
                .addScaledVector(zenithDir, Math.sin(altRad));

            // 지평선 (남쪽 방향으로 쭉 뻗는 선)
            auxHorizonLine.geometry.setFromPoints([
                southDir.clone().multiplyScalar(-1.5), 
                southDir.clone().multiplyScalar(lineLength)
            ]);

            // 태양빛 (하늘에서 관찰자에게 꽂히는 선)
            auxSunRayLine.geometry.setFromPoints([
                sunDir.clone().multiplyScalar(lineLength),
                new THREE.Vector3(0, 0, 0) // 관찰자 위치(원점)
            ]);

            // 고도각 호 (지평선부터 태양빛 각도까지)
            const arcPoints = [];
            const segments = 20;
            for (let i = 0; i <= segments; i++) {
                const a = (i / segments) * altRad;
                const pt = new THREE.Vector3()
                    .addScaledVector(southDir, Math.cos(a))
                    .addScaledVector(zenithDir, Math.sin(a))
                    .multiplyScalar(arcRadius);
                arcPoints.push(pt);
            }
            auxArcLine.geometry.setFromPoints(arcPoints);
        }

        function startTransition() {
            isTransitioning = true;
            transitionProgress = 0;
            document.getElementById('ui-panel').style.pointerEvents = 'none';

            let markerWorldPos = new THREE.Vector3();
            marker.getWorldPosition(markerWorldPos);

            if (pendingView === 'surface') {
                startCamPos.copy(camera.position);
                startTarget.copy(controls.target);
                endTarget.copy(markerWorldPos);
                endCamPos.copy(markerWorldPos).multiplyScalar(1.4); 
            } else {
                currentView = 'space'; 
                updateSimulation(); 
                startTarget.copy(markerWorldPos);
                startCamPos.copy(markerWorldPos).multiplyScalar(1.4);
                endCamPos.set(0, 6, 65);
                endTarget.set(0, 0, 0);
                camera.position.copy(startCamPos);
                controls.target.copy(startTarget);
            }
        }

        function setCamera() {
            controls.reset();
            if (currentView === 'space') {
                camera.position.set(0, 6, 65);
                controls.target.set(0, 0, 0);
            } else {
                camera.position.set(-45, 12, -45); 
                controls.target.set(0, 20, 15); 
            }
            controls.update();
        }

        function handleUI(type, val, btnId) {
            btnClasses[type].forEach(id => {
                document.getElementById(id).classList.remove('active');
            });
            document.getElementById(btnId).classList.add('active');

            if (type === 'view') {
                if (currentView !== val && !isTransitioning) {
                    pendingView = val;
                    startTransition(); 
                }
            } else {
                if (type === 'tilt') isTilted = val;
                if (type === 'season') currentSeason = val;
                updateSimulation();
            }
        }

        document.getElementById('btn-straight').onclick = () => handleUI('tilt', false, 'btn-straight');
        document.getElementById('btn-tilted').onclick = () => handleUI('tilt', true, 'btn-tilted');
        document.getElementById('btn-spring').onclick = () => handleUI('season', 'spring', 'btn-spring');
        document.getElementById('btn-summer').onclick = () => handleUI('season', 'summer', 'btn-summer');
        document.getElementById('btn-autumn').onclick = () => handleUI('season', 'autumn', 'btn-autumn');
        document.getElementById('btn-winter').onclick = () => handleUI('season', 'winter', 'btn-winter');
        document.getElementById('btn-space').onclick = () => handleUI('view', 'space', 'btn-space');
        document.getElementById('btn-surface').onclick = () => handleUI('view', 'surface', 'btn-surface');

        function animate() {
            requestAnimationFrame(animate);
            
            if (isTransitioning) {
                transitionProgress += 0.02; 
                
                if (transitionProgress >= 1) {
                    isTransitioning = false;
                    currentView = pendingView;
                    setCamera(); 
                    document.getElementById('ui-panel').style.pointerEvents = 'auto'; 
                } else {
                    const t = transitionProgress < 0.5 
                        ? 2 * transitionProgress * transitionProgress 
                        : -1 + (4 - 2 * transitionProgress) * transitionProgress;
                    
                    camera.position.lerpVectors(startCamPos, endCamPos, t);
                    controls.target.lerpVectors(startTarget, endTarget, t);
                }
            }
            
            // 시점에 따라 범례 및 보조선 표시 유무 처리
            const isSpace = (currentView === 'space' || pendingView === 'space');
            auxLinesGroup.visible = isSpace;
            document.getElementById('legend-space').style.display = isSpace ? 'block' : 'none';

            controls.update();
            renderer.render(currentView === 'space' ? sceneSpace : sceneSurface, camera);
        }

        updateSimulation();
        setCamera();
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
