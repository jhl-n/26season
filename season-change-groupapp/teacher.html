<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>교사 대표 화면 · 모둠 협력 문제풀이</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="wide-wrap">
    <div class="topbar">
      <div>
        <h1 style="margin-bottom:2px;" id="activityTitle"></h1>
        <span class="muted small">교사 대표 화면 — 전자칠판/빔프로젝터에 띄워주세요</span>
      </div>
      <span class="mode-banner" id="modeBanner"></span>
    </div>

    <div class="class-tabs" id="classTabs"></div>

    <div class="card">
      <div id="boardArea"></div>
    </div>

    <div class="card small muted">
      <b>색 안내</b> &nbsp;
      <span class="pill wait">대기</span>
      <span class="pill" style="background:#fff4d6;color:#a3780a;">진행중</span>
      <span class="pill ok">정답/완료</span>
      <span class="pill bad">오답</span>
      <span class="pill check">교사 확인 필요</span>
      &nbsp;·&nbsp; 모둠 이름 칸이 빨갛게 깜빡이면 도움 요청 중입니다.
    </div>

    <details class="card">
      <summary style="cursor:pointer; font-weight:700;">스테이션 목록 보기 (참고용)</summary>
      <ol id="stationList"></ol>
    </details>
  </div>

  <script src="js/stations-config.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/db-adapter.js"></script>
  <script src="js/teacher.js"></script>
</body>
</html>
