<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>모둠 협력 문제풀이</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    #titleLongPress {
      display: inline-block;
      cursor: default;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }
  </style>
</head>
<body>
  <div class="wrap" style="padding-top:60px;">
    <div class="card" style="text-align:center;">
      <h1 id="titleLongPress">🌗 모둠 협력 문제풀이</h1>
      <p class="muted" id="activityTitle"></p>
      <div style="display:flex; gap:16px; justify-content:center; margin-top:28px; flex-wrap:wrap;">
        <a class="btn" href="student.html" style="text-decoration:none; padding:22px 36px; font-size:1.2rem;">🧑‍🎓 학생으로 입장</a>
      </div>
    </div>
    <div class="card small muted">
      <p><b>학생으로 입장</b>을 눌러 학급 → 모둠 → 이름 → 순서번호를 선택하세요.</p>
      <p id="modeInfo"></p>
    </div>
  </div>

  <script src="js/stations-config.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/db-adapter.js"></script>
  <script>
    document.getElementById("activityTitle").textContent = window.ACTIVITY_TITLE || "";
    const modeEl = document.getElementById("modeInfo");
    Db.ready.then(() => {
      const mode = Db.getMode();
      modeEl.textContent =
        mode === "firebase"
          ? "✅ Firebase에 연결되어 실제 여러 기기 간 동기화가 가능합니다."
          : "⚠️ 데모 모드로 실행 중입니다 (같은 브라우저의 여러 탭끼리만 동기화). 실제 수업에는 js/firebase-config.js에 Firebase 설정을 입력하세요.";
    });

    // 교사 대표 화면 진입: 학생에게는 안 보이는 숨김 메뉴.
    // 제목을 800ms 이상 꾹 누르면(마우스/터치 모두 지원) 교사 화면으로 이동합니다.
    // 화면에는 아무 표시도 하지 않습니다(진행 바 등은 학생이 눈치챌 수 있어 없앴습니다).
    (function setupTeacherLongPress() {
      const title = document.getElementById("titleLongPress");
      const HOLD_MS = 800;
      let timer = null;

      function start(e) {
        e.preventDefault();
        cancel(); // 혹시 남아있던 이전 타이머 정리
        timer = setTimeout(() => {
          window.location.href = "teacher.html";
        }, HOLD_MS);
      }
      function cancel() {
        if (timer) clearTimeout(timer);
        timer = null;
      }

      title.addEventListener("pointerdown", start);
      title.addEventListener("pointerup", cancel);
      title.addEventListener("pointerleave", cancel);
      title.addEventListener("pointercancel", cancel);
      title.addEventListener("contextmenu", (e) => e.preventDefault());
    })();
  </script>
</body>
</html>
